name: Sync Reading Notes & Books

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）检查上游私库更新
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # 必需：GITHUB_TOKEN 产生的 push 不会触发其他 workflow，
  # 因此内容提交后必须用 workflow_dispatch 显式触发 deploy.yml（见末尾步骤）。
  actions: write

concurrency:
  # 与书单同步共用分组，避免两个自动同步同时写基线/同时提交。
  group: content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 检出 uRead
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: 记录同步前笔记版本
        id: before
        run: echo "version=$(node -p "require('./public/notes/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: 同步 Obsidian 读书笔记（书单已拆到每周的 lists-sync）
        env:
          # 只读 PAT，需在仓库 Settings → Secrets → Actions 中配置 OBSIDIAN_TOKEN
          GITHUB_TOKEN: ${{ secrets.OBSIDIAN_TOKEN }}
        run: npm run notes:sync -- --no-audio

      - name: 同步私库电子书到书库
        env:
          GITHUB_TOKEN: ${{ secrets.OBSIDIAN_TOKEN }}
          BOOKS_REPO: ${{ vars.BOOKS_REPO || 'zhubao315/obsidian-vault' }}
          # 可选：用仓库 Variables 覆盖默认 4 个目录前缀（JSON 数组或逗号分隔）
          BOOKS_PATHS: ${{ vars.BOOKS_PATHS }}
        run: npm run books:sync

      - name: 构建站点产物
        run: npm run build

      - name: 重建内容基线与书籍索引
        run: |
          npm run content:inventory
          npm run books:index
          npm run verify:release

      - name: 质量门禁
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run docs:build
          npm run docs:check

      - name: 提交生成产物
        id: commit
        run: |
          # 清单版本由内容哈希派生；版本未变说明只有 generated_at 时间戳变化，
          # 不能因此每天制造一个空提交并触发部署。
          before="${{ steps.before.outputs.version }}"
          after="$(node -p "require('./public/notes/manifest.json').version")"
          books_dirty="$(git status --porcelain -- book-library/books book-library/covers | wc -l)"
          if [ "$before" = "$after" ] && [ "$books_dirty" -eq 0 ]; then
            echo "笔记版本未变（$after）且书库无变化，只有生成时间变化，无需提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 当前策略是 allow_all_legacy（全量公开）。deploy.yml 的 publish:check --strict
          # 会因审批基线落后于新笔记而拦截发布，因此在「仅 legacy 模式」下刷新基线。
          # 一旦切换到 allowlist 等正式策略，这里直接失败，强制人工复核 publish:approve。
          mode="$(node -p "require('./publishing/policy.json').mode")"
          if [ "$mode" = "allow_all_legacy" ]; then
            echo "allow_all_legacy 模式：刷新发布审批基线"
            APPROVE=1 npm run publish:approve
          else
            echo "策略已切换为 $mode：请人工复核并执行 publish:approve，工作流不自动批准"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 都是已知会随笔记/书籍同步更新的路径：显式列出，不让 2>/dev/null || true
          # 把「路径写错」或「git add 失败」伪装成正常情况。
          git add public/notes publishing/content-baseline.json publishing/approved-baseline.json docs/migration book-library/books book-library/covers
          if git diff --cached --quiet; then
            echo "没有内容变化，无需提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 当前 runner 的 git 不支持 push --retry，故不用 || true 掩盖推送失败。
          git commit -m "chore(content-sync): sync notes and books $(date -u +%Y-%m-%dT%H:%MZ)" && git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 触发 Pages 部署
        # GITHUB_TOKEN 的 push 不会触发其他 workflow，必须显式派发 deploy.yml
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
