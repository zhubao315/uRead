name: Sync Reading Notes

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）检查上游私库更新
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # 与书单同步共用分组，避免两个自动同步同时写基线/同时提交。
  group: content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 uRead
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: 记录同步前笔记版本
        id: before
        run: echo "version=$(node -p "require('./public/notes/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: 同步 Obsidian 笔记（书单已拆到每周的 lists-sync）
        env:
          # 只读 PAT，需在仓库 Settings → Secrets → Actions 中配置 OBSIDIAN_TOKEN
          GITHUB_TOKEN: ${{ secrets.OBSIDIAN_TOKEN }}
        run: npm run notes:sync -- --no-audio

      - name: 构建站点产物
        run: npm run build

      - name: 重建内容基线与书籍索引
        run: |
          npm run content:inventory
          npm run books:index
          npm run verify:release

      - name: 质量门禁
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run docs:build
          npm run docs:check

      - name: 提交生成产物
        id: commit
        run: |
          # 清单版本由内容哈希派生；版本未变说明只有 generated_at 时间戳变化，
          # 不能因此每天制造一个空提交并触发部署。
          before="${{ steps.before.outputs.version }}"
          after="$(node -p "require('./public/notes/manifest.json').version")"
          if [ "$before" = "$after" ]; then
            echo "笔记版本未变（$after），只有生成时间变化，无需提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/notes \
            publishing/content-baseline.json \
            docs/migration 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "没有内容变化，无需提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(notes-sync): sync reading notes $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 触发 Pages 部署
        # GITHUB_TOKEN 的 push 不会触发其他 workflow，必须显式派发 deploy.yml
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
