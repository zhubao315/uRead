name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: 安装依赖
        # 使用 lockfile 保证构建可复现
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建（SPA）
        run: npm run build

      - name: 内容完整性对账
        run: npm run verify:release

      - name: 发布治理严格检查
        # 未审批的新增/修改笔记、新敏感命中、新孤儿音频会阻断部署
        run: npm run publish:check -- --strict

      - name: 安装 Hugo Extended（文档站唯一构建依赖，OINK 主题不需要 Node）
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: 构建并自检文档站（Hugo + OINK）
        run: |
          npm run docs:build
          npm run docs:check

      - name: 把文档站并入 SPA 产物（发布到 /uRead/docs/）
        # 应用与文档共用一个 Pages 产物；docs:check 断言过文档首页有回应用的路
        run: mkdir -p dist/docs && cp -r docs-site/. dist/docs/

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
