name: Sync Booklists

on:
  schedule:
    # 每周一 UTC 03:00（北京时间 11:00）检查上游私库书单/主题更新
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  # 必需：GITHUB_TOKEN 产生的 push 不会触发其他 workflow，
  # 因此内容提交后必须用 workflow_dispatch 显式触发 deploy.yml（见末尾步骤）。
  actions: write

concurrency:
  # 与笔记同步共用分组，避免两个自动同步同时写基线/同时提交。
  group: content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 检出 uRead
        uses: actions/checkout@v7

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: 记录同步前书单版本
        id: before
        run: echo "version=$(node -p "require('./public/lists/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: 同步 Obsidian 主题与书单
        env:
          # 只读 PAT，需在仓库 Settings → Secrets → Actions 中配置 OBSIDIAN_TOKEN
          GITHUB_TOKEN: ${{ secrets.OBSIDIAN_TOKEN }}
        run: npm run lists:sync

      - name: 构建站点产物
        run: npm run build

      - name: 重建内容基线与书籍索引
        # 书单变化会改变内容哈希与书籍关联，基线必须一并重算，否则对账会失败。
        run: |
          npm run content:inventory
          npm run books:index
          npm run verify:release

      - name: 质量门禁
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run docs:build
          npm run docs:check

      - name: 提交生成产物
        id: commit
        run: |
          # 清单版本由内容哈希派生；版本未变说明只有 generated_at 时间戳变化，
          # 不能因此每周制造一个空提交并触发部署。
          before="${{ steps.before.outputs.version }}"
          after="$(node -p "require('./public/lists/manifest.json').version")"
          if [ "$before" = "$after" ]; then
            echo "书单版本未变（$after），只有生成时间变化，无需提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 都是已知会随书单同步更新的路径：显式列出，不让 2>/dev/null || true
          # 把「路径写错」或「git add 失败」伪装成正常情况。
          git add public/lists publishing/content-baseline.json docs/migration
          if git diff --cached --quiet; then
            echo "书单没有变化，无需提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 当前 runner 的 git 不支持 push --retry，故不用 || true 掩盖推送失败。
          git commit -m "chore(lists-sync): sync booklists $(date -u +%Y-%m-%dT%H:%MZ)" && git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 触发 Pages 部署
        # GITHUB_TOKEN 的 push 不会触发其他 workflow，必须显式派发 deploy.yml
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
