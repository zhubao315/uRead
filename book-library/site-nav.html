<!-- 静态书页统一站点导航：与 React 主站共用同一套品牌、桌面栏与移动端结构。
     这一份 HTML 被 scripts/books-index.mjs 与 book-library/build.py 共同读取，改动只改这里。
     移动端与 src/components/Navbar.tsx + MobileBottomNav.tsx 对齐：
       顶栏 = 品牌 + 搜索；第二行 = 品牌语 + 主题开关 + 菜单；底栏 = 首页/笔记/书单/书籍。 -->
<style>
.uread-site-nav{position:sticky;top:0;z-index:50;background:light-dark(#fff,#1e293b);border-bottom:1px solid light-dark(#e5e7eb,#334155)}
.uread-site-nav__inner{max-width:1280px;margin:0 auto;padding:0 1rem;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.uread-brand{display:flex;align-items:center;gap:.75rem;color:light-dark(#17243A,#f1f5f9);text-decoration:none;flex-shrink:0}
.uread-brand:hover{text-decoration:none}
.uread-brand img{width:36px;height:36px;display:block}
.uread-brand strong{display:block;font-size:20px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.uread-brand small{display:block;font-size:11px;letter-spacing:.12em;color:light-dark(#64748B,#cbd5e1);margin-top:2px}
.uread-nav-links{display:flex;align-items:center;gap:.25rem;overflow-x:auto;scrollbar-width:none}
.uread-nav-links::-webkit-scrollbar{display:none}
.uread-nav-link{position:relative;display:flex;align-items:center;gap:.5rem;flex-shrink:0;padding:.5rem 1rem;border-radius:.5rem;font-size:14px;font-weight:500;color:light-dark(#374151,#e2e8f0);text-decoration:none;transition:background .15s,color .15s}
.uread-nav-link:hover{color:light-dark(#2457A6,#93c5fd);background:light-dark(#f9fafb,#0f172a);text-decoration:none}
.uread-nav-link svg{width:20px;height:20px;flex-shrink:0}
.uread-nav-link[aria-current="page"]{color:light-dark(#2457A6,#93c5fd);background:light-dark(#eff6ff,#172554)}
.uread-nav-link[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:0;width:4px;height:4px;border-radius:50%;background:light-dark(#2457A6,#93c5fd);transform:translateX(-50%)}
.uread-nav-actions{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.uread-theme-toggle{min-height:36px;min-width:36px;padding:.35rem;border:1px solid light-dark(#d1d5db,#475569);border-radius:.5rem;background:light-dark(#fff,#1e293b);color:light-dark(#374151,#e2e8f0);font:inherit;font-size:14px;cursor:pointer}
.uread-theme-toggle:hover{background:light-dark(#f3f4f6,#334155)}
.uread-nav-search{display:flex;align-items:center;gap:.25rem}
.uread-nav-search input{width:9rem;max-width:9rem;padding:.5rem .75rem;border:1px solid light-dark(#e5e7eb,#334155);border-radius:.5rem;font:inherit;font-size:14px;background:light-dark(#fff,#0f172a);color:light-dark(#17243A,#f1f5f9)}
.uread-nav-search button{display:flex;align-items:center;justify-content:center;min-height:36px;min-width:36px;border:0;border-radius:.5rem;background:transparent;color:light-dark(#4b5563,#cbd5e1);cursor:pointer}
.uread-nav-search button:hover{background:light-dark(#f3f4f6,#334155)}
.uread-nav-search button svg{width:20px;height:20px}
.uread-sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 以下两块只在移动端出现，结构与 React 主站一致 */
.uread-mobile-bar,.uread-bottom-nav{display:none}
.uread-mobile-menu{margin:0;padding:.5rem 1rem;list-style:none;border-top:1px solid light-dark(#e5e7eb,#334155);background:light-dark(#fff,#1e293b)}
.uread-mobile-menu[hidden]{display:none}
.uread-mobile-menu a{display:block;padding:.6rem 0;font-size:14px;color:light-dark(#17243A,#f1f5f9);text-decoration:none}
.uread-mobile-menu a[aria-current="page"]{color:light-dark(#2457A6,#93c5fd);font-weight:600}

@media(max-width:900px){.uread-nav-link{padding:.5rem .65rem}}
@media(max-width:767px){
  .uread-site-nav__inner{min-height:64px;padding:0 1rem}
  .uread-brand small{display:none}
  .uread-brand img{width:36px;height:36px}
  .uread-brand strong{font-size:20px}
  .uread-nav-links{display:none}
  /* 顶栏只留搜索；明暗切换由第二行的按钮承担，避免移动端出现两个开关。 */
  .uread-nav-actions > .uread-theme-toggle{display:none}
  .uread-nav-search input{width:9rem;max-width:9rem}
  .uread-mobile-bar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;border-top:1px solid light-dark(#e5e7eb,#334155);padding:.35rem 1rem}
  .uread-mobile-bar span{font-size:10px;letter-spacing:.16em;color:light-dark(#64748B,#cbd5e1)}
  .uread-mobile-actions{display:flex;align-items:center;gap:.5rem}
  .uread-mobile-menu-btn{min-height:44px;min-width:44px;padding:0 .75rem;border:1px solid light-dark(#d1d5db,#475569);border-radius:.5rem;background:light-dark(#fff,#1e293b);color:light-dark(#374151,#e2e8f0);font:inherit;font-size:14px;cursor:pointer}
  .uread-bottom-nav{display:block;position:fixed;inset-inline:0;bottom:0;z-index:40;border-top:1px solid light-dark(#e5e7eb,#334155);background:light-dark(#fff,#1e293b);padding-bottom:env(safe-area-inset-bottom)}
  .uread-bottom-nav ul{display:grid;grid-template-columns:repeat(4,1fr);margin:0;padding:0;list-style:none}
  .uread-bottom-link{display:flex;min-height:56px;flex-direction:column;align-items:center;justify-content:center;gap:.125rem;font-size:11px;text-decoration:none;color:light-dark(#64748B,#94a3b8)}
  .uread-bottom-link svg{width:20px;height:20px}
  .uread-bottom-link[aria-current="page"]{color:light-dark(#2457A6,#93c5fd);font-weight:600}
  /* 固定底栏会盖住正文，给内容留出空间 */
  .uread-page{padding-bottom:5rem}
}
</style>

      <a class="uread-nav-link" href="/uRead/booklists/"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg><span>书单</span></a>
      <a class="uread-nav-link" href="/uRead/books/"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14M12 7C9.5 5.5 6.5 5 3 6v13c3.5-1 6.5-.5 9 1 2.5-1.5 5.5-2 9-1V6c-3.5-1-6.5-.5-9 1Z"/></svg><span>书籍</span></a>

    </div>
    <div class="uread-nav-actions">
      <button class="uread-theme-toggle" type="button" aria-label="切换到夜间模式" title="切换到夜间模式">☾</button>
      <form class="uread-nav-search" role="search" action="/uRead/find/" method="get">
        <label for="uread-nav-q" class="uread-sr-only">搜索全部数据</label>
        <input id="uread-nav-q" type="search" name="q" placeholder="搜索全部数据" aria-label="搜索全部数据">

      </form>
    </div>
  </div>

    <span>READ · REFLECT · REVISIT</span>

      <button class="uread-theme-toggle" type="button" aria-label="切换到夜间模式" title="切换到夜间模式">☾</button>
      <button class="uread-mobile-menu-btn" type="button" aria-expanded="false" aria-controls="uread-mobile-menu" aria-label="打开导航菜单">菜单</button>

<script>
(function () {
  var KEY = 'color-scheme';
  var meta = document.querySelector('meta[name="color-scheme"]');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.uread-theme-toggle'));
  var system = function () { return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; };
  var stored = null;
  try { stored = localStorage.getItem(KEY); } catch (e) { /* 存储被禁用时仍可切换 */ }
  var preference = stored === 'light' || stored === 'dark' ? stored : 'light dark';
  var resolve = function (value) { return value === 'light dark' ? system() : value; };
  var apply = function (value) {
    preference = value;
    if (meta) meta.setAttribute('content', value);
    try {
      if (value === 'light dark') localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, value);
    } catch (e) { /* 同上 */ }
    var dark = resolve(value) === 'dark';
    var label = dark ? '切换到日间模式' : '切换到夜间模式';
    buttons.forEach(function (button) {
      button.textContent = dark ? '☀' : '☾';
      button.setAttribute('aria-label', label);
      button.title = label;
    });
  };
  buttons.forEach(function (button) {
    button.addEventListener('click', function () {
      var target = resolve(preference) === 'dark' ? 'light' : 'dark';
      apply(target === system() ? 'light dark' : target);
    });
  });
  apply(preference);

  var path = location.pathname;
  var isActive = function (target) {
    return target === '/uRead/' ? (path === '/uRead/' || path === '/uRead') : path.indexOf(target) === 0;
  };
  document.querySelectorAll('.uread-nav-link, .uread-mobile-menu a').forEach(function (link) {
    if (isActive(new URL(link.href, location.origin).pathname)) link.setAttribute('aria-current', 'page');
  });
  document.querySelectorAll('.uread-bottom-link').forEach(function (link) {
    var target = new URL(link.href, location.origin).pathname;
    var active = target === '/uRead/' ? (path === '/uRead/' || path === '/uRead') : path.indexOf(target.replace(/\/$/, '')) === 0;
    if (active) link.setAttribute('aria-current', 'page');
  });

  var menuButton = document.querySelector('.uread-mobile-menu-btn');
  var menu = document.getElementById('uread-mobile-menu');
  if (menuButton && menu) {
    menuButton.addEventListener('click', function () {
      var open = menu.hidden;
      menu.hidden = !open;
      menuButton.setAttribute('aria-expanded', String(open));
      menuButton.setAttribute('aria-label', open ? '关闭导航菜单' : '打开导航菜单');
    });
    menu.addEventListener('click', function (event) {
      if (event.target.closest('a')) {
        menu.hidden = true;
        menuButton.setAttribute('aria-expanded', 'false');
      }
    });
  }
})();
</script>
